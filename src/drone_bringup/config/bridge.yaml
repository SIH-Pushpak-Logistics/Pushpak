# src/drone_bringup/config/bridge.yaml
---
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/world/empty/model/swarm_drone/link/base_link/sensor/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/mavros/imu/data"
  gz_topic_name: "/world/empty/model/swarm_drone/link/base_link/sensor/imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/swarm_drone/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/lidar/scan"
  gz_topic_name: "/world/empty/model/swarm_drone/link/lidar_link/sensor/lidar_sensor/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS