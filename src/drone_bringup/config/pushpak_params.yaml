pushpak_brain:
  ros__parameters:
    rate_hz: 20.0
    kp: 0.8
    v_max_mps: 0.7
    explore_x_min_m: -3.0
    explore_x_max_m: 3.0
    explore_y_min_m: -3.0
    explore_y_max_m: 3.0
    explore_lane_spacing_m: 1.5
    explore_accept_radius_m: 0.25
    explore_start_delay_s: 3.0
    odom_max_age_s: 0.2
    keyframe_rate_hz: 5.0
    keyframe_fifo_len: 200
    survivor_dedup_radius_m: 1.5
    isolation_timeout_s: 2.0
    visual_dropout_variance: 1000000.0
    backtrack_cov_threshold: 0.2
    backtrack_speed_mps: 1.0
    backtrack_accept_radius_m: 0.4

pushpak_telemetry:
  ros__parameters:
    keyframe_rate_hz: 5.0
    heartbeat_rate_hz: 2.0
    peers_alive_rate_hz: 10.0
    peer_timeout_s: 1.75
    survivor_dedup_radius_m: 1.5
    zenoh_listen: "tcp/0.0.0.0:7447"
    zenoh_connect: ""
    proto_path: "/workspace/proto/pushpak.proto"

perception_node:
  ros__parameters:
    enable_visual_velocity: false
    model_path: "/workspace/yolov8n.pt"
    device: "cuda:0"
    imgsz: 416
    conf_threshold: 0.4
    max_rate_hz: 2.0
    odom_staleness_sec: 0.5
    tta_angles_deg: [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345]
    detection_dir: "/workspace/detections"
