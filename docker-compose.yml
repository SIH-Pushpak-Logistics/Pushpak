services:
  swarm_brain:
    build: .
    container_name: swarm_brain_container
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_LOCALHOST_ONLY=1
    volumes:
      - .:/workspace
    tty: true
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]